<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a6ea5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="支払い">
  <meta name="robots" content="noindex, nofollow">
  <title>毎月の支払い</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="pageTitle">支払いの予定</h1>
    </div>
    <div class="month-nav">
      <button type="button" class="icon-btn" data-act="prev" aria-label="前の月">◀</button>
      <b id="monthLabel"></b>
      <button type="button" class="icon-btn" data-act="next" aria-label="次の月">▶</button>
      <button type="button" class="btn small" data-act="thisMonth">今月</button>
    </div>
  </header>

  <div id="notices"></div>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="schedule" class="active"><span class="ico">📅</span><span>予定</span></button>
    <button type="button" data-tab="banks"><span class="ico">🏦</span><span>通帳・差額</span></button>
    <button type="button" data-tab="backup"><span class="ico">💾</span><span>バックアップ</span></button>
    <button type="button" data-tab="settings"><span class="ico">⚙️</span><span>設定</span></button>
  </nav>

  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
