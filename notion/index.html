<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f2f2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notionメモ">
  <meta name="robots" content="noindex, nofollow">
  <title>Notionメモ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">Notionメモ</h1>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button type="button" data-tab="write" class="active"><span class="ico">✏️</span><span>書く</span></button>
    <button type="button" data-tab="history"><span class="ico">🕘</span><span>送ったもの</span></button>
    <button type="button" data-tab="settings"><span class="ico">⚙️</span><span>設定</span></button>
  </nav>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
