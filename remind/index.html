<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a7bd5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="リマインダー">
  <meta name="robots" content="noindex, nofollow">
  <title>リマインダー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="pageTitle">リマインダー</h1>
      <span class="page-hint" id="pageHint"></span>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="list" class="active"><span class="ico">⏰</span><span>予定</span></button>
    <button type="button" data-tab="edit"><span class="ico">＋</span><span>追加</span></button>
    <button type="button" data-tab="done"><span class="ico">✅</span><span>完了</span></button>
    <button type="button" data-tab="settings"><span class="ico">⚙️</span><span>設定</span></button>
  </nav>

  <!-- 時間になったときに出る画面 -->
  <div class="alarm" id="alarm" hidden></div>

  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="parse.js"></script>
  <script src="wheel.js"></script>
  <script src="app.js"></script>
</body>
</html>
