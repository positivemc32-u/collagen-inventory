<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="株ニュース">
  <meta name="robots" content="noindex, nofollow">
  <title>わたしの株ニュース</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="pageTitle">今日のまとめ</h1>
      <button type="button" class="date-chip" id="dateChip" aria-label="表示中の日付"></button>
    </div>
    <div class="budget-row">
      <span>予算</span>
      <button type="button" class="budget-chip" id="budgetChip" aria-label="予算を変える"></button>
      <span class="muted small" id="updatedAt"></span>
    </div>
  </header>

  <div id="notices"></div>

  <main id="main"><p class="loading">読み込み中…</p></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="today" class="active"><span class="ico">🏠</span><span>今日</span></button>
    <button type="button" data-tab="picks"><span class="ico">💡</span><span>銘柄</span></button>
    <button type="button" data-tab="calendar"><span class="ico">📅</span><span>日程</span></button>
    <button type="button" data-tab="stories"><span class="ico">📰</span><span>裏話</span></button>
    <button type="button" data-tab="settings"><span class="ico">⚙️</span><span>設定</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
