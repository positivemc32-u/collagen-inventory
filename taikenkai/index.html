<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9643f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="体験会精算">
  <meta name="robots" content="noindex, nofollow">
  <title>体験会の精算</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="pageTitle">会の一覧</h1>
      <span class="page-hint" id="pageHint"></span>
    </div>
  </header>

  <div id="notices"></div>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="events" class="active"><span class="ico">📅</span><span>会の一覧</span></button>
    <button type="button" data-tab="event"><span class="ico">🧾</span><span>精算</span></button>
    <button type="button" data-tab="summary"><span class="ico">📊</span><span>集計</span></button>
    <button type="button" data-tab="settings"><span class="ico">⚙️</span><span>設定</span></button>
    <button type="button" data-tab="backup"><span class="ico">💾</span><span>バックアップ</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
